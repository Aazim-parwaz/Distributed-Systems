replication.mode=async
replication.factor=3
write.quorum=2
node.id=${server.port}
anti.entropy.delay.ms=50000

# Per-node peer lists live in application-{port}.properties, activated via:
#   -Dspring.profiles.active=8080  (or 8081 / 8082)
# This fallback lists all nodes; getNodes() filters out self at runtime as a safety net.
Nodes=localhost:8080,localhost:8081,localhost:8082,localhost:8083